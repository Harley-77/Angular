<main class="container"> <!-- Define o conteúdo principal da página e aplica nosso container. -->

    <h1>Vitrine de Produtos</h1> 
    <div class = "campo-busca">
        <label for="buscaProduto">Pesquisar Produtos</label>
        <input 
            type="text" 
            id="buscaProduto" 
            placeholder="Digite o nome do produto"
            [formControl]="ctlBusca"> <!-- Aqui o Angular conecto o cmpo HTML ao formcontrol criado no TS.-->
    </div>

<!-- Verifica se os produtos ainda estão sendo carregados. -->
    @if (blnCarregando) { 
        <p>Carregando produtos... Aguarde!</p> 

<!-- Verifica se ocorreu algum erro durante a requisição. -->
    } @else if (blnErro) { 
        <p class="mensagem-erro">Não foi possível carregar os produtos.</p> 

<!-- Verifica se a consulta terminou sem retornar produtos. -->
    } @else if (arrProdutosFiltrados.length === 0) { <!-- Aplica-se aos produtos filtrados, pois o usuário pode ter digitado algo que não existe. -->
        <p>Nenhum produto encontrado.</p> 

<!-- Exibe a galeria somente depois que o carregamento terminar sem erro. -->
    } @else { 
        <section class="galeria-produtos"> <!-- Cria o container que receberá os produtos. -->
            @for (varProduto of arrProdutosFiltrados; track varProduto.id) { <!-- Percorre o array e cria um elemento para cada produto. -->
                <app-card-produto [varProduto]="varProduto"></app-card-produto> <!-- Envia o produto atual par auma nova instância do componnte cardProduto. o vaProduto da esquerda é a propriedade od input, o da direita é a variável criado pelo for acima-->
            }
        </section>
    }
</main>
